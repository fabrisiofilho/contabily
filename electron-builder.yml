appId: br.com.contabily.desktop
productName: Contabily

directories:
  buildResources: build
  output: dist

asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/bindings/**
  - node_modules/file-uri-to-path/**
  - database/**
  - out/main/migrations/**

npmRebuild: true
buildDependenciesFromSource: false

files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*, .npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

extraResources:
  - from: build
    to: build
    filter:
      - 'icon.*'
  - from: out/main/migrations
    to: migrations
    filter:
      - '**/*.sql'

# ----------- WINDOWS -----------
win:
  executableName: contabily
  icon: build/icon.ico
  target: nsis
  defaultArch: x64
  extraResources:
    - from: resources
      to: .
      filter:
        - 'whisper/whisper-cli.exe'
        - 'whisper/*.dll'
        - 'whisper/ggml-tiny.bin'

nsis:
  artifactName: ${productName}-setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true

# ----------- MAC -----------
mac:
  target: dmg
  notarize: false
  icon: build/icon.icns

# ----------- LINUX -----------
linux:
  target:
    - appImage
    - deb
    - snap
  icon: build/icon.png
  maintainer: 'fabrisiofilho'
  category: Finance
  artifactName: ${productName}-${version}.${ext}
  synopsis: 'Controle financeiro pessoal'
  description: 'Aplicação desktop para controle financeiro pessoal com gestão de contas, transações, metas e cartões de crédito.'
# ----------- AUTO UPDATE / PUBLISH -----------
publish:
  provider: github
  owner: fabrisiofilho
  repo: contabily
  releaseType: release
